name: Sanal Çadır Günlük Nöbetçi & İndirim Takip Botu

on:
  schedule:
    # Hafif Nöbet Modu (Daily Sentry): Her gün akşam saat 20:05 TSİ (17:05 UTC) tek seferlik kontrol yapar.
    # Sanal Çadır açılışları 20:00'de yapıldığı için erken açılışları ve sürpriz indirimleri anında yakalar.
    - cron: '5 17 * * *'
  workflow_dispatch:
    inputs:
      notify_on_first_run:
        description: 'İlk çalıştırmada bildirim gönderilsin mi? (Varsayılan: False)'
        required: false
        default: 'False'

# Aynı anda birden fazla görevin çakışmasını engelleyen kilit
concurrency:
  group: sanalcadir-tracker-${{ github.ref }}
  cancel-in-progress: false

# data/products_state.json dosyasını depoya geri commit/push edebilmek için yazma izni
permissions:
  contents: write

jobs:
  track-discounts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Depoyu İndir (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Python Kurulumu (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🛡️ Tek Seferlik Nöbetçi Tarama
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_PRICE_LIMIT: ${{ vars.MAX_PRICE_LIMIT || '10000' }}
          MIN_DISCOUNT_RATE: ${{ vars.MIN_DISCOUNT_RATE || '20' }}
          PRICE_DROP_THRESHOLD: ${{ vars.PRICE_DROP_THRESHOLD || '5' }}
          ALLOWED_BRANDS: ${{ vars.ALLOWED_BRANDS || '' }}
          NOTIFY_ON_FIRST_RUN: ${{ github.event.inputs.notify_on_first_run || 'False' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=================================================================="
          echo "🚀 GÜNLÜK SANAL ÇADIR NÖBET TARAMASI BAŞLIYOR (Saat: $(date -u +'%H:%M:%S UTC'))"
          echo "=================================================================="

          # 1. Depodaki en güncel durum dosyasını çek
          git fetch origin "$REF_NAME"
          git reset --hard "origin/$REF_NAME"

          # 2. Sanal Çadır kontrolünü çalıştır (Site açıksa fırsatları Telegram'a iletir)
          python main.py --once

          # 3. Eğer fiyat/stokta bir değişiklik olduysa depoya kaydet
          if [ -f data/products_state.json ]; then
            cp data/products_state.json /tmp/products_state_latest.json
            git fetch origin "$REF_NAME"
            git reset --hard "origin/$REF_NAME"
            cp /tmp/products_state_latest.json data/products_state.json
            git add data/products_state.json

            if git diff --staged --quiet; then
              echo "ℹ️ data/products_state.json dosyasında fiyat/stok değişikliği yok, commit atlanıyor."
            else
              git commit -m "chore(state): gunluk nobet taramasi guncellendi [skip ci]"
              git push origin HEAD:"$REF_NAME" || (git pull --rebase origin "$REF_NAME" && git push origin HEAD:"$REF_NAME")
              echo "✅ data/products_state.json başarıyla GitHub deposuna kaydedildi."
            fi
          fi
