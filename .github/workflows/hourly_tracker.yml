name: Sanal Çadır 7/24 Saatlik Ayakkabı İndirim & Stok Takip Botu

on:
  schedule:
    # Aylık 2.000 dakika/sorgu kotasını aşmamak için akıllı zamanlama (Türkiye saati UTC+3):
    # - Gündüz & Akşam (08:00 - 01:00 TSİ / 05:00 - 21:59 UTC): Her 20 dakikada bir (7, 27, 47. dk)
    - cron: '7,27,47 5-21 * * *'
    # - Gece (01:00 - 08:00 TSİ / 22:00 - 04:59 UTC): Saatte 1 kez (7. dk)
    # Toplam: Günde 58 çalışma (~58 dk/gün -> Ayda ~1.740 dk, 2.000 dk kotasının altında kalır)
    - cron: '7 22-23,0-4 * * *'
  workflow_dispatch:
    inputs:
      notify_on_first_run:
        description: 'İlk çalıştırmada bildirim gönderilsin mi? (Varsayılan: False)'
        required: false
        default: 'False'

# Aynı anda 2 görevin paralel çalışmasını kesin olarak engelleyen resmi GitHub Actions kilidi
concurrency:
  group: sanalcadir-tracker-${{ github.ref }}
  cancel-in-progress: false

# data/products_state.json dosyasını depoya geri commit/push edebilmek için izinler
permissions:
  contents: write

jobs:
  track-discounts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Depoyu İndir (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Python Kurulumu (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Sanal Çadır İndirim & Stok Taramasını Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_PRICE_LIMIT: ${{ vars.MAX_PRICE_LIMIT || '10000' }}
          MIN_DISCOUNT_RATE: ${{ vars.MIN_DISCOUNT_RATE || '20' }}
          PRICE_DROP_THRESHOLD: ${{ vars.PRICE_DROP_THRESHOLD || '5' }}
          ALLOWED_BRANDS: ${{ vars.ALLOWED_BRANDS || '' }}
          NOTIFY_ON_FIRST_RUN: ${{ github.event.inputs.notify_on_first_run || 'False' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=================================================================="
          echo "🚀 SANAL ÇADIR TARAMASI BAŞLIYOR (Saat: $(date -u +'%H:%M:%S UTC'))"
          echo "=================================================================="

          # 1. Tarama öncesi depodaki en güncel products_state.json dosyasını çek
          git fetch origin "$REF_NAME"
          git reset --hard "origin/$REF_NAME"

          # 2. Sanal Çadır taramasını tek sefer çalıştır ve hemen bitir (sleep ile dakika harcama!)
          python main.py --once

          # 3. Güncellenen products_state.json dosyasını çakışmasız (conflict-free) olarak depoya kaydet
          cp data/products_state.json /tmp/products_state_latest.json
          git fetch origin "$REF_NAME"
          git reset --hard "origin/$REF_NAME"
          cp /tmp/products_state_latest.json data/products_state.json
          git add data/products_state.json

          if git diff --staged --quiet; then
            echo "ℹ️ data/products_state.json dosyasında fiyat/stok değişikliği yok, commit atlanıyor."
          else
            git commit -m "chore(state): periyodik fiyat ve stok durumu güncellendi [skip ci]"
            git push origin HEAD:"$REF_NAME"
            echo "✅ data/products_state.json başarıyla GitHub deposuna kaydedildi."
          fi
